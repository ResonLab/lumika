# Publie le site d Lumika sur GitHub Pages.
#
# Pourquoi un workflow plutot que « servir docs/ » directement : la page du
# carte de couverture importe la physique, qui vit dans commun/, hors de docs/, parce
# qu'elle tourne aussi dans l'application et dans les tests. On ne recopie pas la
# formule dans le depot — elle vit a un seul endroit — donc la copie est faite
# ici, au moment de publier.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'commun/acoustique.js'
      - 'scripts/preparer-site.mjs'
      - 'src/partage/conditions.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois, et on laisse finir celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Le site ne doit pas partir si les deux langues ont divergé.
      - name: Verifier le site
        run: node tests/coherence-site.mjs

      # Une page de conditions perimee engagerait l'utilisateur sur un texte
      # different de celui qu'il a accepte dans l'application.
      - name: Verifier les conditions
        run: node tests/coherence-conditions.mjs

      # Les pages anglaises et les pages de conditions sont **deduites** de la
      # source. Les regenerer ici plutot que de faire confiance a ce qui est
      # commite : une page oubliee apres une correction partirait telle quelle,
      # et personne ne le verrait avant un lecteur anglophone.
      - name: Regenerer les pages deduites
        run: |
          node scripts/publier-conditions.mjs
          node scripts/traduire-site.mjs

      # Et re-verifier apres regeneration : si le commit contenait une page
      # perimee, la difference apparait maintenant.
      - name: Verifier apres regeneration
        run: |
          node tests/coherence-site.mjs
          node tests/coherence-conditions.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploiement
        uses: actions/deploy-pages@v4
